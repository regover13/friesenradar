# test-radar.devprops.de -- Testinstanz von FriesenRadar (deploy/test-radar/ im App-Repo).
#
# Laeuft nur bei Bedarf (Admin der echten App -> Betrieb -> Testinstanz, oder `test-radar
# start`), mit einer Datenkopie, und beendet sich nach 2 Stunden. Ist sie aus, antwortet
# nginx mit 502. Zugang nur mit Passwort: Die Kopie enthaelt echte Mitgliederdaten, und der
# Forum-Login ist in ihr abgeschaltet.

server {
    listen 80;
    server_name test-radar.devprops.de;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name test-radar.devprops.de;
    include snippets/hsts.conf;

    ssl_certificate     /etc/letsencrypt/live/test-radar.devprops.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-radar.devprops.de/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic           "FriesenRadar Test";
    auth_basic_user_file /etc/nginx/test-radar.htpasswd;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live-Strom (SSE): nicht puffern, lange offen halten.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
