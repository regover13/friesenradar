# test-radar.devprops.de -- Testinstanz von FriesenRadar (deploy/test-radar/ im App-Repo).
#
# Laeuft nur bei Bedarf (Admin der echten App -> Betrieb -> Testinstanz, oder `test-radar
# start`), mit einer Datenkopie, und beendet sich nach 2 Stunden. Ist sie aus, antwortet
# nginx mit 502. Zugang nur ueber den Zugangslink des laufenden Laufs (setzt ein Cookie; ohne
# es 403): Die Kopie enthaelt echte Mitgliederdaten. Das Forum kennt diese Adresse nicht; die
# Mitglieder-Sitzung gibt deshalb nginx mit. Link, Cookie-Wert und Sitzung stehen in
# test-radar-sitzung.conf -- von `test-radar start` je Lauf neu ausgestellt, bei `stop` gesperrt.

server {
    listen 80;
    server_name test-radar.devprops.de;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name test-radar.devprops.de;
    include snippets/hsts.conf;

    ssl_certificate     /etc/letsencrypt/live/test-radar.devprops.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-radar.devprops.de/privkey.pem;
    add_header X-Robots-Tag "noindex, nofollow" always;

    include /etc/nginx/test-radar-sitzung.conf;

    client_max_body_size 20m;

    location / {
        if ($tr_ok = 0) { return 403; }
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "$tr_sitzung$http_cookie";
        # Live-Strom (SSE): nicht puffern, lange offen halten.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
