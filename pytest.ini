[pytest]
# Die Tests legen ihre temporären Dateien in den Arbeitsspeicher (/dev/shm, tests/conftest.py).
# pytest hebt sonst die Dateien der letzten drei Läufe auf, hier je rund 950 MB. Am 02.11.2026
# lagen so 4,3 GB im Arbeitsspeicher, der Server geriet in den Swap, die Suite brauchte über
# sieben statt zwei Minuten, und Tests mit Zeitgrenzen schlugen fehl. Aufbewahrt wird jetzt nur,
# was zu einem gescheiterten Test gehört, und nur vom letzten Lauf.
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
