name: Test-Image

# Teststufe vor der Produktion: Ein Push auf den Zweig `test` laesst die Tests laufen, baut
# das Image und legt es auf dem Server bereit (lokaler Tag test-radar:aktuell). GESTARTET wird
# dabei nichts -- die Testinstanz laeuft nur bei Bedarf (Admin -> Betrieb -> Testinstanz bzw.
# `test-radar start`, s. deploy/test-radar/). Laeuft sie gerade, bekommt sie den neuen Stand.
#
# Ablauf Test -> Prod: Stand auf `test` pushen, ansehen, dann denselben Stand nach `main`.

on:
  push:
    branches: [test]

env:
  # Folgt dem Repo-Namen (friesenspy bzw. nach dem Umzug friesenradar).
  IMAGE: ghcr.io/${{ github.repository }}

# Nur lesen, ausdruecklich -- nicht der Repo-Voreinstellung ueberlassen. Jobs, die mehr
# brauchen (Paket schreiben), nennen es selbst.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Abhaengigkeiten
        run: pip install -r requirements-test.txt
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider -n 4

  bauen:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build & Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Nur bereitlegen, nicht starten -- das tut deploy/deploy.sh im Auftrag 'test'.
      # ⚠ Der Schluessel DEPLOY_SSH_KEY ist in /root/.ssh/authorized_keys an EINEN Befehl
      # gebunden (restrict,command="/opt/friesenradar/deploy.sh"). Der sshd fuehrt ausschliesslich
      # dieses Skript aus; das Wort hinter der Adresse ist kein Befehl, sondern Eingabe
      # (SSH_ORIGINAL_COMMAND: 'deploy' oder 'test'). Der Ablauf selbst steht in
      # deploy/deploy.sh -- wer ihn aendert, kopiert die Datei auf den Server, sie wird NICHT
      # automatisch ausgerollt.
      #
      # Bis 04.10.2026 lief hier appleboy/ssh-action mit einem unbeschraenkten root-Schluessel:
      # Wer das Secret oder das Tag der Action in die Hand bekam, hatte eine Root-Shell. Jetzt
      # ein schlichtes ssh, der Host-Schluessel festgeschrieben statt beim ersten Kontakt
      # geglaubt, und der GITHUB_TOKEN (gilt nur fuer diesen Lauf) kommt ueber stdin.
      - name: Auf dem Server bereitlegen
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 600 /dev/null deploy_key
          trap 'rm -f deploy_key' EXIT
          printf '%s\n' "$SSH_KEY" > deploy_key
          printf '%s\n' "167.86.127.129 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH1oZHC0DbcDqjMsz3fAAcz5h7pWpfzWcUheb0sKym0p" > known_hosts
          printf '%s\n' "$PULL_TOKEN" | ssh -i deploy_key \
            -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            root@167.86.127.129 test
