name: Build & Deploy

on:
  push:
    branches: [main]
    # Ein Deploy startet den Container neu und trifft jede offene Sitzung -- SSE bricht ab,
    # ein geoeffnetes Kniebrett wird schwarz (s. CLAUDE.md, Kniebrett-Standards). Pfade, die
    # das Image nachweislich nicht beruehren, loesen deshalb keinen aus: Der Dockerfile
    # kopiert ausschliesslich requirements.txt, app/ und scripts/.
    #
    # Bewusst als Ausschlussliste (paths-ignore), nicht als Einschlussliste (paths): Wer hier
    # eine Zeile vergisst, bekommt einen ueberfluessigen Deploy -- bei paths waere es ein
    # ausbleibender, und der faellt erst auf, wenn eine Aenderung nicht ankommt.
    #
    # Beruehrt ein Commit AUCH nur eine nicht gelistete Datei, laeuft der Workflow wie immer.
    paths-ignore:
      - 'docs/**'            # Specs, Analysen, Handbuch
      - 'friesenbruegge/**'  # Sim-Bruegge, laeuft auf dem Flieger-PC (Issue #25)
      - 'msfs-panel/**'      # EFB-Panel, eigener Build und eigener Auslieferungsweg
      - '**.md'              # README, COORDINATION, jedes Begleitdokument

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/regover13/friesenspy

# Nur lesen, ausdruecklich -- nicht der Repo-Voreinstellung ueberlassen. Jobs, die mehr
# brauchen (Paket schreiben), nennen es selbst.
permissions:
  contents: read

jobs:
  # Die Tests laufen VOR dem Bau -- ein roter Stand wird nicht deployt. Bis zum 26.09.2026 gab
  # es diesen Schritt nicht: Getestet wurde nur, wenn eine Sitzung vor dem Push daran dachte,
  # und an dem Tag ging so ein roter Test live (Changelog-Text ohne „FriesenBrügge").
  # Python wie im Image (3.11); Node fuer die Tests, die Quelltext aus index.html ausfuehren.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Abhaengigkeiten
        run: pip install -r requirements-test.txt
      - name: Tests
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider -n 4 2>&1 | tee /tmp/pytest.log

      # Rote Tests melden sich selbst: Der Deploy-Job mit seiner Discord-Meldung startet dann gar
      # nicht erst, und ohne diesen Schritt bliebe ein roter Lauf stumm (26.09.2026).
      - name: Discord benachrichtigen (Tests rot)
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::Secret DISCORD_WEBHOOK nicht gesetzt — Benachrichtigung übersprungen."
            exit 0
          fi
          TITLE=$(printf '%s' "$COMMIT_MSG" | head -1)
          ROT=$(grep -E '^(FAILED|ERROR) ' /tmp/pytest.log 2>/dev/null | head -8 | cut -c1-150 || true)
          SUMME=$(grep -E '[0-9]+ (passed|failed)' /tmp/pytest.log 2>/dev/null | tail -1 || true)
          jq -n \
            --arg title "$TITLE" \
            --arg url "$COMMIT_URL" \
            --arg rot "$ROT" \
            --arg summe "$SUMME" \
            --arg actor "$ACTOR" \
            --arg run "$RUN_URL" \
            '{embeds: [{
                author: {name: "FriesenSpy — Tests rot, nicht deployt"},
                title: $title,
                url: $url,
                description: ("Auf dem VPS läuft die bisherige Version weiter.\n\n" + $summe
                              + (if $rot == "" then "" else "\n```\n" + $rot + "\n```" end)
                              + "\nvon **" + $actor + "** · [Workflow-Log](" + $run + ")"),
                color: 15158332
             }]}' > /tmp/discord.json
          curl --fail --silent --show-error -X POST \
               -H 'Content-Type: application/json' \
               -d @/tmp/discord.json "$WEBHOOK" \
            || echo "::warning::Discord-Benachrichtigung fehlgeschlagen."

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build & Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ⚠ Der Schluessel DEPLOY_SSH_KEY ist in /root/.ssh/authorized_keys an EINEN Befehl
      # gebunden (restrict,command="/opt/friesenspy/deploy.sh"). Der sshd fuehrt ausschliesslich
      # dieses Skript aus; das Wort hinter der Adresse ist kein Befehl, sondern Eingabe
      # (SSH_ORIGINAL_COMMAND: 'deploy' oder 'test'). Der Ablauf selbst steht in
      # deploy/deploy.sh -- wer ihn aendert, kopiert die Datei auf den Server, sie wird NICHT
      # automatisch ausgerollt.
      #
      # Bis 04.10.2026 lief hier appleboy/ssh-action mit einem unbeschraenkten root-Schluessel:
      # Wer das Secret oder das Tag der Action in die Hand bekam, hatte eine Root-Shell. Jetzt
      # ein schlichtes ssh, der Host-Schluessel festgeschrieben statt beim ersten Kontakt
      # geglaubt, und der GITHUB_TOKEN (gilt nur fuer diesen Lauf) kommt ueber stdin.
      - name: Deploy auf VPS via SSH
        if: success()
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PULL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 600 /dev/null deploy_key
          trap 'rm -f deploy_key' EXIT
          printf '%s\n' "$SSH_KEY" > deploy_key
          printf '%s\n' "167.86.127.129 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH1oZHC0DbcDqjMsz3fAAcz5h7pWpfzWcUheb0sKym0p" > known_hosts
          printf '%s\n' "$PULL_TOKEN" | ssh -i deploy_key \
            -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            root@167.86.127.129 deploy

      # Meldet das Ergebnis des Deploys (inkl. Health-Check) nach Discord.
      # Voraussetzung: Repo-Secret DISCORD_WEBHOOK (Discord-Kanal-Webhook, OHNE /github-Suffix).
      # Fehlt das Secret, wird der Schritt still übersprungen statt den Workflow rot zu färben.
      - name: Discord benachrichtigen
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          # Commit-Daten NUR über env, nie direkt in den Shell-Text interpolieren
          # (sonst könnte eine Commit-Message Befehle einschleusen).
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::Secret DISCORD_WEBHOOK nicht gesetzt — Benachrichtigung übersprungen."
            exit 0
          fi
          VERSION=$(jq -r '.[0].version' app/CHANGELOG.json 2>/dev/null || echo '?')
          TITLE=$(printf '%s' "$COMMIT_MSG" | head -1)
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993
            TEXT='Deploy erfolgreich — Health-Check auf friesenspy.devprops.de bestanden.'
          else
            COLOR=15158332
            TEXT="Deploy fehlgeschlagen ($JOB_STATUS) — auf dem VPS läuft die bisherige Version weiter."
          fi
          jq -n \
            --arg name "FriesenSpy v$VERSION" \
            --arg title "$TITLE" \
            --arg url "$COMMIT_URL" \
            --arg text "$TEXT" \
            --arg actor "$ACTOR" \
            --arg run "$RUN_URL" \
            --argjson color "$COLOR" \
            '{embeds: [{
                author: {name: $name},
                title: $title,
                url: $url,
                description: ($text + "\n\nvon **" + $actor + "** · [Workflow-Log](" + $run + ")"),
                color: $color
             }]}' > /tmp/discord.json
          curl --fail --silent --show-error -X POST \
               -H 'Content-Type: application/json' \
               -d @/tmp/discord.json "$WEBHOOK" \
            || echo "::warning::Discord-Benachrichtigung fehlgeschlagen — Deploy selbst ist davon unberührt."
